[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bkcrack-py"
version = "1.8.1"
description = "Crack legacy zip encryption with Biham and Kocher's known plaintext attack (pure Python port of bkcrack)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "bkcrack-py contributors" }]
keywords = ["zip", "zipcrypto", "known plaintext attack", "cryptanalysis", "bkcrack"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: zlib/libpng License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.21"]
test = ["pytest>=7"]

[project.scripts]
bkcrack = "bkcrack.cli:main"

[project.urls]
Upstream = "https://github.com/kimci86/bkcrack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bkcrack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long running tests (deselect with '-m \"not slow\"')",
    "crossval: tests requiring the official bkcrack binary or the reference sources",
]
